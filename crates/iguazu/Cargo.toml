[package]
name = "iguazu"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
once-array.workspace = true
num-traits.workspace = true
num-complex.workspace = true
log.workspace = true
indexmap = { workspace = true, features = ["serde"] }
serde_json = "1.0.120"
serde = { version = "1.0.204", features = ["derive"] }
bytemuck.workspace = true
thiserror = "2.0.12"
elsa = "1.11.2"
async-executor.workspace = true
futures-lite = "2.6.0"
async-trait = "0.1.88"
csv = { version = "1.3.1", optional = true }
lexical-core = { version = "1.0.5", optional = true }
csv-core = "0.1.12"
clap = { workspace = true, optional = true, features = ["derive"] }
strum = { version = "0.27.1", features = ["derive"] }
ecow.workspace = true
arrayvec = "0.7.6"
atomic-waker = "1.1.2"
slab = "0.4.11"
url = "2.5.7"
async-lock = "3.4.1"
zstd = { version = "0.13.3", optional = true }
jiff = "0.2.16"

[features]
fs = ["dep:blocking", "dep:piper"]
web = ["dep:web-sys", "dep:wasm-bindgen-futures"]
clap = ["dep:clap", "fs"]

csv = ["dep:csv", "dep:lexical-core"]
izs = ["dep:zstd"]

default = ["csv", "izs"]

[target.'cfg(any(target_family = "unix", target_family = "windows"))'.dependencies]
blocking = { version = "1.6.1", optional = true }
piper = { git = "https://github.com/kevinmehall/piper.git", rev = "5ef4e1324232adda03a2932c24c83432038ee397", optional = true }

[target.'cfg(target_arch="wasm32")'.dependencies]
web-sys = { version = "0.3.82", features = ["File", "Blob", "ReadableStream", "ReadableStreamDefaultReader", "ReadableStreamReadResult"], optional = true }
wasm-bindgen-futures = { version = "0.4.55",  optional = true }
send_wrapper = { version = "0.6.0", features = ["futures"] }

[lib]
path = "lib.rs"
