[workspace]
resolver = "2"
members = [
    "crates/*"
]

[workspace.package]
edition = "2024"
version = "0.0.1"
rust-version = "1.98"
homepage = "https://iguazu.signalspec.org"
authors = ["Kevin Mehall <km@kevinmehall.net>"]
license = "MPL-2.0"
repository = "https://github.com/signalspec/iguazu"

[workspace.dependencies]
iguazu = { path = "crates/iguazu", version = "0.0.1" }
iguazu-egui = { path = "crates/iguazu-egui", version = "0.0.1" }
iguazu-capture = { path = "crates/iguazu-capture", version = "0.0.1" }
async-executor = "1.13.1"
bytemuck = "1.21.0"
clap = { version = "4.5.39", features = ["derive"] }
ecow = { version = "0.3.0", features = ["serde"] }
eframe =  { version = "0.37.0", default-features = false }
egui = "0.37.0"
egui-wgpu = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg"] }
egui_table = "0.11.0"
env_logger = "0.11.9"
futures-lite = "2.6.0"
futures-util = "0.3.32"
hashbrown = "0.17"
indexmap = "2"
itertools = "0.15.0"
jiff = "0.2.39"
log = "0.4.22"
num-complex = { version = "0.4.3", features = ["bytemuck"] }
num-rational = "0.4.1"
num-traits = "0.2.15"
once-array = "0.1.0"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
wgpu = "30"
winit = { version = "0.30", default-features = false }

[profile.release]
panic = "abort"
